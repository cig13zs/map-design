<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map title</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f3efe6; --card: #fbf8f1; --ink: #2a2723; --muted: #5c564d; --faint: #8a8378;
    --sea: #d7e3e8; --grat: #c6d4da; --land: #e4ddcf; --land-2: #d8cfbd; --border: #fbf8f1;
    --accent: #b8322a; --accent-2: #e08a5f; --region-label: #a59b8a; --halo: #e4ddcf;
    --ramp: #f4e3c7, #ebbd8f, #d98a5e, #b8552f, #7f2a1d;
  }
  [data-theme="dark"] {
    --page: #0e1116; --card: #151a21; --ink: #ece6da; --muted: #a9a294; --faint: #7d776c;
    --sea: #10161d; --grat: #1c2530; --land: #262d36; --land-2: #313a45; --border: #151a21;
    --accent: #f0a04b; --accent-2: #f6c98f; --region-label: #6f7782; --halo: #262d36;
  }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: 'IBM Plex Sans Condensed', sans-serif; }
  .card { width: 1100px; margin: 24px auto; background: var(--card); padding: 28px 32px 18px; border-top: 6px solid var(--accent); box-sizing: border-box; }
  h1 { font: 600 30px/1.1 'Source Serif 4', serif; margin: 0 0 4px; }
  .dek { font-size: 16px; color: var(--muted); margin: 0 0 12px; }
  .src { font-size: 12px; color: var(--faint); margin-top: 6px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: 'IBM Plex Sans Condensed', sans-serif; }
</style></head><body>
<div class="card">
  <h1 id="title"></h1><p class="dek" id="dek"></p>
  <svg id="map" viewBox="0 0 1036 470"></svg>
  <p class="src" id="src"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
// ---- helpers: copy as-is, then write one draw() per map ----
if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const W = 1036, H = 470;
const WORLD_50M = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json';
const WORLD_110M = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json';
const NE_110M = 'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/ne_110m_admin_0_countries.geojson';

// TopoJSON (world-atlas, us-atlas) or GeoJSON (Natural Earth). Antarctica is dropped unless keep is set.
async function world(url = WORLD_50M, { keepAntarctica = false } = {}) {
  const t = await d3.json(url);
  const drop = f => !keepAntarctica && (f.id === '010' || f.properties?.ADM0_A3 === 'ATA');
  if (t.type === 'Topology') {
    const obj = t.objects.countries || t.objects.states;
    const countries = topojson.feature(t, obj);
    countries.features = countries.features.filter(f => !drop(f));
    return { countries, borders: topojson.mesh(t, obj, (a, b) => a !== b) };
  }
  t.features = t.features.filter(f => !drop(f));
  return { countries: t, borders: null };  // GeoJSON has no shared arcs: base() strokes each shape instead
}

// sea, graticule, land, internal borders. Pass sphere=true for globes and world views.
function base(svg, path, w, { sphere = false, graticule = true, fill = css('--land') } = {}) {
  const outline = sphere ? { type: 'Sphere' } : null;
  if (sphere) svg.append('path').datum(outline).attr('d', path).attr('fill', css('--sea'));
  else svg.append('rect').attr('width', W).attr('height', H).attr('fill', css('--sea'));
  if (graticule) svg.append('path').datum(d3.geoGraticule10()).attr('d', path)
    .attr('fill', 'none').attr('stroke', css('--grat')).attr('stroke-width', .6);
  const land = svg.append('g');
  const shapes = land.selectAll('path').data(w.countries.features).join('path').attr('d', path).attr('fill', fill);
  if (w.borders) svg.append('path').datum(w.borders).attr('d', path).attr('fill', 'none')
    .attr('stroke', css('--border')).attr('stroke-width', .9).attr('stroke-linejoin', 'round');
  else shapes.attr('stroke', css('--border')).attr('stroke-width', .9).attr('stroke-linejoin', 'round');
  if (sphere) svg.append('path').datum(outline).attr('d', path).attr('fill', 'none').attr('stroke', css('--grat'));
  return shapes;  // one path per country: shapes.attr('fill', f => ...) recolours them
}

// text with a halo in the colour underneath, so labels stay readable over lines and borders
function label(svg, [x, y], text, { size = 13, weight = 400, anchor = 'middle', dy = 0, halo = css('--halo'), fill = css('--ink') } = {}) {
  return svg.append('text').attr('x', x).attr('y', y + dy).attr('text-anchor', anchor)
    .attr('font-size', size).attr('font-weight', weight).attr('fill', fill)
    .attr('paint-order', 'stroke').attr('stroke', halo).attr('stroke-width', 3).attr('stroke-linejoin', 'round').text(text);
}

// spaced small caps for regions, seas and deserts; never haloed, never bold
function regionLabel(svg, [x, y], text, size = 11) {
  return svg.append('text').attr('x', x).attr('y', y).attr('text-anchor', 'middle').attr('font-size', size)
    .attr('letter-spacing', size * .28).attr('fill', css('--region-label')).text(text.toUpperCase());
}

// a route drawn twice: a wide halo in the card colour, then the line itself
function route(svg, path, coords, { width = 3, dash = null, color = css('--accent') } = {}) {
  const d = { type: 'LineString', coordinates: coords };
  svg.append('path').datum(d).attr('d', path).attr('fill', 'none').attr('stroke', css('--card'))
    .attr('stroke-width', width + 4).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
  return svg.append('path').datum(d).attr('d', path).attr('fill', 'none').attr('stroke', color)
    .attr('stroke-width', width).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round').attr('stroke-dasharray', dash);
}

// end points are filled accent dots; stops are hollow
function dot(svg, [x, y], { end = false, r = end ? 6 : 4 } = {}) {
  return svg.append('circle').attr('cx', x).attr('cy', y).attr('r', r)
    .attr('fill', end ? css('--accent') : css('--card')).attr('stroke', css('--accent')).attr('stroke-width', 2);
}

// stepped legend for a choropleth: one swatch per bin, labelled at the breaks
function stepLegend(svg, [x, y], colors, breaks, title, { sw = 46, fmt = d => d } = {}) {
  const g = svg.append('g').attr('transform', `translate(${x},${y})`);
  g.append('text').attr('y', -8).attr('font-size', 12).attr('font-weight', 600).attr('fill', css('--ink')).text(title);
  colors.forEach((c, i) => g.append('rect').attr('x', i * sw).attr('width', sw - 2).attr('height', 10).attr('fill', c));
  breaks.forEach((b, i) => g.append('text').attr('x', (i + 1) * sw - 1).attr('y', 24).attr('text-anchor', 'middle')
    .attr('font-size', 11).attr('fill', css('--muted')).text(fmt(b)));
  return g;
}

// nested-circle legend for proportional symbols; r is the same sqrt scale the map uses
function circleLegend(svg, [x, y], r, values, title, fmt = d => d) {
  values = [...values].sort((a, b) => b - a);  // largest first, so the title and guides clear it
  const g = svg.append('g').attr('transform', `translate(${x},${y})`);
  g.append('text').attr('y', -2 * r(values[0]) - 10).attr('font-size', 12).attr('font-weight', 600).attr('fill', css('--ink')).text(title);
  values.forEach(v => {
    g.append('circle').attr('cy', -r(v)).attr('r', r(v)).attr('fill', 'none').attr('stroke', css('--muted'));
    g.append('line').attr('x1', 0).attr('x2', r(values[0]) + 10).attr('y1', -2 * r(v)).attr('y2', -2 * r(v)).attr('stroke', css('--faint')).attr('stroke-dasharray', '2 2');
    g.append('text').attr('x', r(values[0]) + 14).attr('y', -2 * r(v) + 4).attr('font-size', 11).attr('fill', css('--muted')).text(fmt(v));
  });
  return g;
}

function header(title, dek, src) {
  document.title = title;
  d3.select('#title').text(title); d3.select('#dek').text(dek); d3.select('#src').text(src);
}

// ---- the map ----
async function draw() {
  header('The Manila galleons, 1565 to 1815',
         'Once a year each way: west with the trade winds past Guam, east on the westerlies far to the north',
         'Routes simplified from the usual sailing tracks. Base map: Natural Earth via world-atlas.');
  const svg = d3.select('#map'), w = await world();
  // centred on the date line so neither route is cut
  const proj = d3.geoEqualEarth().rotate([170, 0])
    .fitExtent([[20, 20], [W - 20, H - 20]], { type: 'MultiPoint', coordinates: [[114, 6], [-86, 6], [114, 47], [-86, 47]] });
  const path = d3.geoPath(proj);
  base(svg, path, w);

  const manila = [120.98, 14.6], acapulco = [-99.89, 16.85], guam = [144.75, 13.45], mendocino = [-124.4, 40.44];
  const strait = [124.3, 12.55];  // San Bernardino Strait, the way out of and back into the archipelago
  const west = [acapulco, [-106, 13.5], [-125, 13.2], [-145, 13], [-165, 13], [175, 13], [158, 13.2], guam, [133, 13], strait, manila];
  const east = [manila, strait, [128, 16], [137, 27], [143, 34], [155, 38.5], [180, 40], [-150, 41], [-132, 41], mendocino,
    [-118, 33], [-110, 22.9], acapulco];

  route(svg, path, west);
  route(svg, path, east);

  // small chevrons in the accent show which way each route ran
  function chevrons(coords, every = 170) {
    const line = svg.append('path').datum({ type: 'LineString', coordinates: coords }).attr('d', path).attr('fill', 'none').node();
    const len = line.getTotalLength();
    for (let at = every * 0.75; at < len - 40; at += every) {
      const a = line.getPointAtLength(at), b = line.getPointAtLength(at + 1);
      const angle = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      svg.append('path').attr('d', 'M-4,-4 L1,0 L-4,4').attr('fill', 'none').attr('stroke', css('--accent'))
        .attr('stroke-width', 2).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round')
        .attr('transform', `translate(${a.x},${a.y}) rotate(${angle})`);
    }
    line.remove();
  }
  chevrons(west);
  chevrons(east);

  const at = c => proj(c);
  dot(svg, at(manila), { end: true });
  dot(svg, at(acapulco), { end: true });
  dot(svg, at(guam));
  dot(svg, at(mendocino));
  label(svg, at(manila), 'Manila', { size: 16, weight: 600, anchor: 'end', dy: 5, halo: css('--sea') }).attr('dx', -10);
  label(svg, at(acapulco), 'Acapulco', { size: 16, weight: 600, anchor: 'start', dy: 18, halo: css('--sea') }).attr('dx', 6);
  label(svg, at(guam), 'Guam', { dy: 22, halo: css('--sea') });
  label(svg, at(mendocino), 'Cape Mendocino', { anchor: 'start', dy: 4 }).attr('dx', 9);

  // name each route along its own line, in the sea
  label(svg, at([-160, 13]), 'Westbound, about three months', { size: 13, dy: 22, halo: css('--sea'), fill: css('--muted') });
  label(svg, at([172, 40]), 'Eastbound, four to six months', { size: 13, dy: -15, halo: css('--sea'), fill: css('--muted') });

  regionLabel(svg, at([-170, 27]), 'Pacific Ocean', 12);
}
draw().then(() => document.body.dataset.ready = '1');
</script></body></html>
